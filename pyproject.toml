[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditable-order-document-qa"
version = "0.1.0"
description = "Evidence-first question answering over checkout, fulfillment, receipt, and order update documents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[project.scripts]
order-doc-api = "order_document_qa.receipt_qa_api:run"
index-order-docs = "order_document_qa.order_document_indexer:run"

[tool.hatch.build.targets.wheel]
packages = ["src/order_document_qa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

